<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar avec logo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
     <link rel="stylesheet" href="resultat.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg" role="navigation" aria-label="Navigation principale">
        <div class="container">
            <a class="navbar-brand" href="#" aria-label="MY DiGiTAL SCHOOL - Accueil">
                <img src="../images/LogoMDS.png" alt="Logo MY DiGiTAL SCHOOL">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Basculer la navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Menu centré -->
                <ul class="navbar-nav navbar-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/session.html" aria-current="page"><i class="bi bi-calendar-event me-1" aria-hidden="true"></i> Sessions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/resultat.html"><i class="bi bi-bar-chart me-1" aria-hidden="true"></i> Résultats</a>
                    </li>
                </ul>
                <!-- Menu Compte à droite -->
               <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1" aria-hidden="true"></i> 
                            <span id="username">Compte</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i> Déconnexion</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- En-tête de page -->
        <div class="page-header">
            <h2 class="page-title">Résultats des Votes</h2>
        </div>

        <!-- Résumé global -->
        <div class="summary-container">
            <div class="summary-card">
                <div class="summary-icon">
                    <i class="bi bi-music-note-beamed"></i>
                </div>
                <div class="summary-title">Total de musiques</div>
                <div class="summary-value" id="totalMusics">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div class="summary-title">Participants</div>
                <div class="summary-value" id="totalParticipants">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">
                    <i class="bi bi-hand-thumbs-up-fill"></i>
                </div>
                <div class="summary-title">Total de votes</div>
                <div class="summary-value" id="totalVotes">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">
                    <i class="bi bi-trophy-fill"></i>
                </div>
                <div class="summary-title">Sessions actives</div>
                <div class="summary-value" id="activeSessions">0</div>
            </div>
        </div>

        <!-- Filtres -->
        <div class="filters-container">
            <div class="filter-group">
                <label for="sessionFilter" class="form-label">Filtrer par session:</label>
                <select class="form-select" id="sessionFilter" onchange="filterResults()">
                    <option value="all">Toutes les sessions</option>
                </select>
                <button class="btn btn-outline-primary btn-sm" onclick="refreshResults()">
                    <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i> Actualiser
                </button>
            </div>
        </div>

        <!-- Conteneur pour les résultats -->
        <div id="resultsContainer">
            <!-- Spinner de chargement -->
            <div class="spinner-container">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-center mt-4" id="paginationContainer" style="display: none;">
            <nav aria-label="Pagination des résultats">
                <ul class="pagination">
                    <li class="page-item disabled">
                        <a class="page-link" href="#" aria-label="Page précédente">Précédent</a>
                    </li>
                    <li class="page-item active">
                        <a class="page-link" href="#" aria-label="Page 1">1</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#" aria-label="Page 2">2</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#" aria-label="Page suivante">Suivant</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Overlay de chargement -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Chargement...</span>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="resultat.js"></script>
</body>
